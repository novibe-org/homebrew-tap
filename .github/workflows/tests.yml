name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, macos-13, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: Homebrew/actions/setup-homebrew@master
      - run: brew audit --formula novibe-org/tap/agentbox
      - run: brew install --formula novibe-org/tap/agentbox
      - run: brew test novibe-org/tap/agentbox
